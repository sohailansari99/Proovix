name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/api/package-lock.json

    - name: Install API dependencies
      run: npm install --prefix apps/api

    - name: Run API tests
      run: |
        cd apps/api
        TEST_OUTPUT=$(npm test -- --runInBand --forceExit 2>&1)
        echo "$TEST_OUTPUT"
        # Check that at least some tests ran
        TEST_COUNT=$(echo "$TEST_OUTPUT" | grep -oP 'Tests:\s+\K\d+' || echo "0")
        if [ "$TEST_COUNT" -eq "0" ]; then
          echo "::error::No tests were executed. Check jest configuration."
          exit 1
        fi
        # Check for failures
        if echo "$TEST_OUTPUT" | grep -q "failed"; then
          echo "::error::API tests failed"
          exit 1
        fi

  web-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json

    - name: Install web dependencies
      run: npm install --prefix apps/web

    - name: Build web app
      run: npm run build --prefix apps/web
